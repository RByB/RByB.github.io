<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<main class="container text-center mt-5">
  <h1 class="mb-4">Contáctanos</h1>
  <p class="mb-4" style="font-size: 1.1rem;">
    Por el momento el contacto será solamente vía correo electrónico. 
    Puedes usar el formulario para enviarnos un mensaje o comentario.
  </p>

  
  <div class="mb-5">
    <img src="images/corre.png" alt="Correo" class="img-fluid" style="max-height: 100px;">
    <p class="mt-2">rehabilitacionymedici@gmail.com</p>
  </div>

 
  <div class="row justify-content-center">
    <div class="col-md-6 text-start">
      <form action="https://formsubmit.co/rehabilitacionymedici@gmail.com" method="POST">
        <!-- Aqui debes de cambiar donde dice tu usuario por el nombre de usuaruo de git y tambien el tu repo al nombre del repositorio -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://TU_USUARIO.github.io/TU_REPO/gracias.html">

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Tu correo electrónico:</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje:</label>
          <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
